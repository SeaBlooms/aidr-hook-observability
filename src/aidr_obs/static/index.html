<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIDR Hook Observability</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a; --text: #e6e8ee; --muted: #8b93a7;
    --accent: #6ea8fe; --block: #f06a6a; --ask: #f2b84b; --mask: #b48cff; --allow: #4cc38a; --context: #5bc0de;
    --dry: #8b93a7; --other: #d08770; --edge: #4a5263;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 -apple-system, BlinkMacSystemFont,
         "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 20px; border-bottom: 1px solid var(--border);
           background: var(--panel); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }
  nav { display: flex; flex-wrap: wrap; gap: 4px; }
  header h1, nav button, header label { white-space: nowrap; }
  nav button, .btn, select, input[type=text] { background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font: inherit; }
  nav button { cursor: pointer; }
  nav button.active { border-color: var(--accent); color: var(--accent); }
  .btn { cursor: pointer; }
  main { padding: 20px; max-width: 1400px; margin: 0 auto; }
  .grid { display: grid; gap: 16px; }
  .cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px;
             font-weight: 600; }
  .stat { font-size: 26px; font-weight: 600; }
  .stat small { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  .muted { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--panel); }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--panel2); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
          border: 1px solid currentColor; white-space: nowrap; }
  .v-block { color: var(--block); } .v-ask { color: var(--ask); } .v-mask { color: var(--mask); }
  .v-allow, .v-ok { color: var(--allow); } .v-context { color: var(--context); }
  .v-dry_run { color: var(--dry); } .v-other, .v-unknown, .v-incomplete { color: var(--other); }
  .v-failed, .v-no_key, .v-budget_exhausted { color: var(--block); } .v-skipped, .v-nothing_sent { color: var(--muted); }
  .hbar { display: grid; grid-template-columns: 160px 1fr 50px; gap: 8px; align-items: center; margin: 4px 0; }
  .hbar .track { background: var(--panel2); border-radius: 4px; height: 10px; overflow: hidden; }
  .hbar .fill { height: 100%; background: var(--accent); }
  .hbar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar .n { text-align: right; color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; color: var(--muted); font-size: 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px;
              vertical-align: -1px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .scroll { max-height: 70vh; overflow: auto; }
  pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; overflow: auto;
        white-space: pre-wrap; word-break: break-word; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        max-height: 420px; margin: 6px 0 12px; }
  .lvl-ERROR { color: var(--block); }
  #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 95vw); background: var(--panel);
            border-left: 1px solid var(--border); padding: 16px 20px; overflow: auto; transform: translateX(100%);
            transition: transform .15s ease; z-index: 10; box-shadow: -12px 0 30px rgba(0,0,0,.35); }
  #drawer.open { transform: none; }
  #drawer h3 { margin: 14px 0 4px; font-size: 13px; color: var(--muted); }
  dl.kv { display: grid; grid-template-columns: 150px 1fr; gap: 3px 12px; margin: 0; }
  dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; word-break: break-word; }
  .empty { color: var(--muted); padding: 20px 0; text-align: center; }
  svg text { fill: var(--muted); font-size: 10px; }
  .notice { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px;
            margin-bottom: 16px; color: var(--muted); }
  .c-loopback, .c-mcp { color: var(--context); } .c-private-ip { color: var(--ask); }
  .c-public-ip { color: var(--block); } .c-domain { color: var(--accent); }
  .tag { display: inline-block; padding: 0 6px; margin: 1px 4px 1px 0; border-radius: 4px; font-size: 11px;
         background: var(--panel2); border: 1px solid var(--border); }
  .tag.warn { color: var(--ask); border-color: var(--ask); }
  .turn { border-left: 2px solid var(--border); padding: 4px 0 8px 12px; margin: 10px 0; }
  .turn .who { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .turn .tool { margin: 4px 0; padding: 4px 8px; background: var(--bg); border: 1px solid var(--border);
                border-radius: 6px; cursor: pointer; }
  .turn .tool code { word-break: break-all; }
  .clip { white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow: auto; }
  .graph-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; }
  #cy { height: calc(100vh - 230px); min-height: 420px; background: var(--bg); border: 1px solid var(--border);
        border-radius: 8px; }
  .graph-side { max-height: calc(100vh - 170px); overflow: auto; }
  .graph-side h3 { margin: 14px 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase;
                   letter-spacing: .05em; }
  .nbr { display: flex; justify-content: space-between; gap: 8px; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  .nbr:hover { background: var(--panel2); }
  .nbr span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ex { margin: 4px 0; padding: 4px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
        cursor: pointer; } .ex code { word-break: break-all; }
  .btn.mini { padding: 1px 8px; font-size: 11px; margin-left: 6px; vertical-align: 1px; }
  .chip { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 999px;
          padding: 2px 10px 2px 8px; font: inherit; font-size: 12px; cursor: pointer; }
  .chip.off { opacity: .4; text-decoration: line-through; }
  .tag[data-gfocus] { cursor: pointer; } .tag[data-gfocus]:hover { border-color: currentColor; }
  .gtype { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; border-radius: 2px; }
  @media (max-width: 1100px) { .graph-wrap { grid-template-columns: 1fr; } #cy { height: 60vh; }
                              .graph-side { max-height: none; } }
  @media (max-width: 900px) { .cols-4 { grid-template-columns: repeat(2, 1fr); } .cols-2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>AIDR Hook Observability</h1>
  <nav id="tabs">
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="verdicts">Verdicts</button>
    <button data-tab="explorer">Event explorer</button>
    <button data-tab="errors">Errors &amp; health</button>
    <button data-tab="mcp">MCP inventory</button>
    <button data-tab="destinations">Destinations</button>
    <button data-tab="sessions">Sessions</button>
    <button data-tab="sensitive">Sensitive access</button>
    <button data-tab="usage">Usage &amp; performance</button>
    <button data-tab="graph">Graph</button>
  </nav>
  <div class="spacer"></div>
  <select id="range" title="Time range">
    <option value="3600000">Last hour</option>
    <option value="86400000" selected>Last 24 hours</option>
    <option value="604800000">Last 7 days</option>
    <option value="2592000000">Last 30 days</option>
    <option value="0">All time</option>
  </select>
  <label class="muted"><input type="checkbox" id="auto"> auto-refresh</label>
  <button class="btn" id="refresh" title="Re-read the logs and captures">Refresh</button>
</header>
<main id="view"></main>
<aside id="drawer"></aside>

<script src="/static/vendor/cytoscape.min.js"></script>
<script>
"use strict";
const COLORS = ["#6ea8fe", "#4cc38a", "#f2b84b", "#b48cff", "#f06a6a", "#5bc0de", "#d08770", "#a3be8c", "#ebcb8b",
                "#88c0d0"];
const state = { tab: "overview", filters: {}, offset: 0 };
const $ = (sel) => document.querySelector(sel);

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;",
                                                        "'": "&#39;" }[c]));
}
function since() {
  const span = Number($("#range").value);
  return span ? Date.now() - span : 0;
}
async function api(path, params = {}) {
  const q = new URLSearchParams({ since: since(), ...params });
  const res = await fetch(path + "?" + q.toString());
  if (!res.ok) throw new Error(path + ": HTTP " + res.status);
  return res.json();
}
function pill(v) { return v ? `<span class="pill v-${esc(v)}">${esc(v)}</span>` : '<span class="muted">-</span>'; }
function fmtTs(ts) { return esc((ts || "").replace("T", " ").slice(0, 23)); }
function fmtMs(ms) {
  if (ms == null) return "-";
  return ms >= 1000 ? (ms / 1000).toFixed(2) + " s" : ms + " ms";
}
function hbars(obj, cls) {
  const entries = Array.isArray(obj) ? obj : Object.entries(obj || {});
  if (!entries.length) return '<div class="empty">No data</div>';
  const max = Math.max(...entries.map((e) => e[1]));
  return entries.map(([k, n]) => `<div class="hbar"><div class="lbl" title="${esc(k)}">${cls ? pill(k) : esc(k)}</div>
    <div class="track"><div class="fill" style="width:${(100 * n / max).toFixed(1)}%"></div></div>
    <div class="n">${n}</div></div>`).join("");
}
function stackedBars(series, bucketMs) {
  const keys = [...new Set(series.flatMap((s) => Object.keys(s.counts)))].sort();
  if (!keys.length) return '<div class="empty">No hook runs in this range</div>';
  const W = 1000, H = 180, pad = 24, n = series.length;
  const max = Math.max(1, ...series.map((s) => Object.values(s.counts).reduce((a, b) => a + b, 0)));
  const bw = (W - pad) / n;
  let bars = "";
  series.forEach((s, i) => {
    let y = H - pad;
    keys.forEach((k, ki) => {
      const v = s.counts[k] || 0;
      if (!v) return;
      const h = (H - pad - 6) * v / max;
      y -= h;
      bars += `<rect x="${pad + i * bw + 1}" y="${y}" width="${Math.max(1, bw - 2)}" height="${h}"
        fill="${COLORS[ki % COLORS.length]}"><title>${esc(new Date(s.t).toLocaleString())} ${esc(k)}: ${v}</title></rect>`;
    });
  });
  const ticks = [0, Math.floor(n / 2), n - 1].filter((v, i, a) => a.indexOf(v) === i && series[v]);
  const fmt = (t) => bucketMs >= 86400000 ? new Date(t).toLocaleDateString()
    : new Date(t).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  const anchor = (i) => (i === n - 1 && n > 1 ? "end" : i === 0 ? "start" : "middle");
  const tickX = (i) => (i === n - 1 && n > 1 ? pad + (i + 1) * bw : pad + i * bw);
  const labels = ticks.map((i) => `<text x="${tickX(i)}" y="${H - 6}" text-anchor="${anchor(i)}">
    ${esc(fmt(series[i].t))}</text>`).join("");
  const legend = keys.map((k, ki) => `<span><i style="background:${COLORS[ki % COLORS.length]}"></i>${esc(k)}</span>`)
    .join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="height:200px">
    <text x="0" y="12">${max}</text><line x1="${pad}" x2="${W}" y1="${H - pad}" y2="${H - pad}" stroke="#2a2f3a"/>
    ${bars}${labels}</svg><div class="legend">${legend}</div>`;
}

// --- entity graph ---------------------------------------------------------------------------------
const NODE_TYPES = {
  agent: { label: "Agent", shape: "hexagon", color: "--accent", size: 46 },
  project: { label: "Project", shape: "round-rectangle", color: "--mask", size: 36 },
  session: { label: "Session", shape: "ellipse", color: "--allow", size: 28 },
  tool: { label: "Tool", shape: "diamond", color: "--context", size: 32 },
  destination: { label: "Destination", shape: "ellipse", color: "--other", size: 26 },
  mcp: { label: "MCP server", shape: "round-hexagon", color: "--context", size: 30 },
  sensitive: { label: "Sensitive", shape: "triangle", color: "--ask", size: 32 },
};
const DEST_CLASS = { "public-ip": "--block", "private-ip": "--ask", loopback: "--dry", domain: "--other" };
const SEVERE = ["block", "ask", "mask"];
const VERDICT_FILTERS = {
  all: { label: "All verdicts", keep: null },
  flagged: { label: "Flagged only (block, ask, mask, context)", keep: ["block", "ask", "mask", "context"] },
  block: { label: "Blocked only", keep: ["block"] },
};
Object.assign(state, { graphFocus: null, graphTrail: [], graphExpanded: [], graphHide: new Set(),
                       graphVerdict: "all", graphSel: null, graphPos: null, graphZoom: null, cy: null });
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/** A "view in graph" button for any table row or drawer: focuses the graph on that entity. */
function graphLink(id) {
  return `<button class="btn mini" data-gfocus="${esc(id)}" title="Show this in the graph">Graph</button>`;
}
function graphHash() {
  return "#graph" + (state.graphFocus ? "?focus=" + encodeURIComponent(state.graphFocus) : "");
}

function setGraphFocus(id, { push = true } = {}) {
  if (push && state.graphFocus !== id) state.graphTrail.push(state.graphFocus);
  if (!push) state.graphTrail = [];
  Object.assign(state, { graphFocus: id, graphExpanded: [], graphPos: null, graphZoom: null, graphSel: id });
  state.tab = "graph";
  $("#drawer").classList.remove("open");
  history.replaceState(null, "", graphHash());
  render();
}
function graphBack() {
  const prev = state.graphTrail.pop();
  Object.assign(state, { graphFocus: prev ?? null, graphExpanded: [], graphPos: null, graphZoom: null,
                         graphSel: prev ?? null });
  history.replaceState(null, "", graphHash());
  render();
}

/** Union `extra` into `g`, keeping the first copy of each node and edge. */
function mergeGraph(g, extra) {
  const seenN = new Set(g.nodes.map((n) => n.id)), seenE = new Set(g.edges.map((e) => e.id));
  extra.nodes.forEach((n) => { if (!seenN.has(n.id)) { seenN.add(n.id); g.nodes.push(n); } });
  extra.edges.forEach((e) => { if (!seenE.has(e.id)) { seenE.add(e.id); g.edges.push(e); } });
  g.by_type = {};
  g.nodes.forEach((n) => { g.by_type[n.type] = (g.by_type[n.type] || 0) + 1; });
  return g;
}

function graphElements(nodes, edges, pos) {
  const verdictColor = (v) => css(SEVERE.includes(v) || v === "context" ? "--" + v : "--edge");
  return [
    ...nodes.map((n) => {
      const t = NODE_TYPES[n.type] || NODE_TYPES.tool;
      const fill = css(n.type === "destination" ? DEST_CLASS[n.class] || t.color : t.color);
      const severe = SEVERE.includes(n.worst);
      return { group: "nodes", position: pos[n.id] ? { ...pos[n.id] } : undefined,
        classes: n.id === state.graphFocus ? "root" : "",
        data: { ...n, fill, shape: t.shape, size: t.size + Math.min(24, 4 * Math.log2(1 + n.count)),
                border: severe ? css("--" + n.worst) : css("--panel"), bw: severe ? 4 : 1.5 } };
    }),
    ...edges.map((e) => ({ group: "edges",
      data: { ...e, color: verdictColor(e.worst), width: 1 + Math.min(6, Math.log2(1 + e.count)) } })),
  ];
}

function graphPanel(n) {
  const g = state.graphData;
  if (!n) {
    return `<h2>Graph</h2><p class="muted">Click a node for its details and links. Double-click to expand it with
      every action that involves it. Drag to rearrange, scroll to zoom. Line colour is the worst verdict on that link,
      and a thick border marks a block, ask or mask.</p>
      <h3>Nodes</h3>${hbars(Object.entries(g.by_type).map(([t, c]) => [(NODE_TYPES[t] || {}).label || t, c]))}`;
  }
  const d = n.data();
  const t = NODE_TYPES[d.type] || {};
  const facts = { type: t.label || d.type, actions: d.count, class: d.class, path: d.path, agent: d.agent,
                  first: (d.first || "").replace("T", " "), last: (d.last || "").replace("T", " ") };
  if (state.graphFocus && d.in_focus != null && d.id !== state.graphFocus) {
    facts["with focus"] = d.in_focus + " of " + d.count + " actions";
  }
  const nbrs = n.connectedEdges().filter((e) => !e.hasClass("hidden") && e.connectedNodes(".hidden").empty())
    .map((e) => {
      const out = e.source().id() === d.id;
      return { e, other: out ? e.target() : e.source(), rel: e.data("rel"), out };
    }).sort((a, b) => b.e.data("count") - a.e.data("count"));
  const nbrRows = nbrs.map(({ e, other, rel, out }) => `<div class="nbr" data-node="${esc(other.id())}">
    <span><span class="muted">${out ? "" : "← "}${esc(rel)}${out ? " →" : ""}</span> ${esc(other.data("label"))}</span>
    <span>${pill(e.data("worst"))} <span class="muted">${e.data("count")}</span></span></div>`).join("");
  const sessions = (d.sessions || []).map((k) => `<div class="nbr" data-session="${esc(k)}"><span>${esc(k)}</span>
    <span class="muted">timeline</span></div>`).join("");
  const examples = (d.examples || []).map((x) => `<div class="ex" data-capture="${esc(x.capture_id)}">${pill(x.verdict)}
    <strong>${esc(x.tool || "?")}</strong> <span class="muted">${fmtTs(x.ts)}</span><div><code>${esc(x.summary)}</code>
    </div></div>`).join("");
  const expanded = state.graphExpanded.includes(d.id);
  const buttons = [
    d.id !== state.graphFocus ? `<button class="btn" data-gfocus="${esc(d.id)}">Focus on this</button>` : "",
    `<button class="btn" data-gexpand="${esc(d.id)}"${expanded ? " disabled" : ""}>${expanded ? "Expanded"
      : "Expand"}</button>`,
    d.type === "session" ? `<button class="btn" data-session="${esc(d.key)}">Session timeline</button>` : "",
  ].join(" ");
  return `<h2>${esc(t.label || d.type)}</h2><div style="font-size:15px;font-weight:600;word-break:break-all">
    ${esc(d.label)}</div><div style="margin:8px 0">${verdictTags(d.verdicts)}</div>
    ${kv(facts, Object.keys(facts))}<div class="filters" style="margin:12px 0 0">${buttons}</div>
    <div id="gmsg" class="muted"></div>
    <h3>Connected (${nbrs.length})</h3>${nbrRows || '<div class="muted">None shown</div>'}
    ${sessions ? `<h3>Sessions</h3>${sessions}` : ""}
    ${examples ? `<h3>Recent actions</h3>${examples}` : ""}`;
}

function selectNode(id) {
  const cy = state.cy;
  if (!cy) return;
  cy.elements().removeClass("faded focus");
  const n = id ? cy.getElementById(id) : null;
  state.graphSel = n && n.nonempty() && !n.hasClass("hidden") ? id : null;
  if (state.graphSel) {
    cy.elements().difference(n.closedNeighborhood()).addClass("faded");
    n.addClass("focus");
  }
  $("#graph-side").innerHTML = graphPanel(state.graphSel ? n : null);
}

/** Client-side filters: hidden node types, and a verdict filter that keeps only links whose worst
 * verdict matches (every link on an action's path carries that action's verdict, so whole paths stay). */
function applyGraphFilters() {
  const cy = state.cy;
  if (!cy) return;
  const keep = VERDICT_FILTERS[state.graphVerdict].keep;
  cy.batch(() => {
    cy.elements().removeClass("hidden");
    if (keep) cy.edges().forEach((e) => { if (!keep.includes(e.data("worst"))) e.addClass("hidden"); });
    cy.nodes().forEach((n) => {
      if (n.id() === state.graphFocus) return;
      const byType = state.graphHide.has(n.data("type"));
      const byVerdict = keep && n.connectedEdges().every((e) => e.hasClass("hidden"));
      if (byType || byVerdict) n.addClass("hidden");
    });
    cy.edges().forEach((e) => { if (e.connectedNodes(".hidden").nonempty()) e.addClass("hidden"); });
  });
  const nodes = cy.nodes().not(".hidden").length, edges = cy.edges().not(".hidden").length;
  const total = cy.nodes().length;
  $("#gcount").innerHTML = (nodes < total ? `${nodes} of ${total} nodes` : `${nodes} nodes`) + ` &middot; ${edges} edges`
    + (keep && !edges ? ' &middot; <span class="v-ask">no links match this verdict filter</span>' : "");
  if (state.graphSel && cy.getElementById(state.graphSel).hasClass("hidden")) state.graphSel = null;
  selectNode(state.graphSel);
}

async function expandNode(id) {
  const cy = state.cy;
  const n = cy && cy.getElementById(id);
  if (!n || n.empty()) return;
  const extra = await api("/api/graph", { focus: id });
  if (!state.cy || state.cy !== cy) return;  // re-rendered meanwhile
  const newNodes = extra.nodes.filter((x) => cy.getElementById(x.id).empty());
  const newEdges = extra.edges.filter((x) => cy.getElementById(x.id).empty());
  if (!state.graphExpanded.includes(id)) state.graphExpanded.push(id);
  mergeGraph(state.graphData, extra);
  const c = n.position(), r = 90 + 8 * newNodes.length, pos = {};
  newNodes.forEach((x, i) => {
    const a = (2 * Math.PI * i) / Math.max(1, newNodes.length);
    pos[x.id] = { x: c.x + r * Math.cos(a), y: c.y + r * Math.sin(a) };
  });
  cy.add(graphElements(newNodes, newEdges, pos));
  applyGraphFilters();
  if (newNodes.length) cy.layout({ ...graphLayout(true), eles: cy.elements().not(".hidden"), animate: true,
                                   animationDuration: 300, fit: true, padding: 30 }).run();
  selectNode(id);
  const msg = $("#gmsg");
  if (msg) {
    msg.textContent = newNodes.length || newEdges.length
      ? `Added ${newNodes.length} nodes and ${newEdges.length} links.` + (extra.truncated ? " (capped)" : "")
      : "Everything this node's actions touch is already shown.";
  }
}

function saveGraphView() {
  if (!state.cy) return;
  state.graphPos = {};
  state.cy.nodes().forEach((n) => { state.graphPos[n.id()] = { ...n.position() }; });
  state.graphZoom = { zoom: state.cy.zoom(), pan: { ...state.cy.pan() } };
  state.cy.destroy();
  state.cy = null;
}

function initGraph() {
  const g = state.graphData;
  if (!g || !g.nodes.length || typeof cytoscape !== "function" || !$("#cy")) return;
  const pos = state.graphPos || {};
  const known = g.nodes.every((n) => pos[n.id]);
  const cy = cytoscape({
    container: $("#cy"),
    elements: graphElements(g.nodes, g.edges, pos),
    minZoom: 0.1,
    maxZoom: 4,
    style: [
      { selector: "node", style: {
        "background-color": "data(fill)", shape: "data(shape)", width: "data(size)", height: "data(size)",
        "border-color": "data(border)", "border-width": "data(bw)", label: "data(label)", color: css("--text"),
        "font-size": 10, "text-valign": "bottom", "text-margin-y": 4, "text-wrap": "ellipsis",
        "text-max-width": 140, "text-outline-color": css("--bg"), "text-outline-width": 2, "min-zoomed-font-size": 7 } },
      { selector: "edge", style: {
        width: "data(width)", "line-color": "data(color)", "target-arrow-color": "data(color)",
        "target-arrow-shape": "triangle", "arrow-scale": 0.8, "curve-style": "bezier", opacity: 0.85 } },
      { selector: "node.root", style: { "font-size": 13, "font-weight": "bold", "underlay-color": css("--text"),
        "underlay-opacity": 0.12, "underlay-padding": 10 } },
      { selector: "node.focus", style: { "underlay-color": css("--accent"), "underlay-opacity": 0.25,
        "underlay-padding": 8 } },
      { selector: ".faded", style: { opacity: 0.12 } },
      { selector: ".hidden", style: { display: "none" } },
      { selector: "edge.hl", style: { label: "data(rel)", "font-size": 9, color: css("--muted"),
        "text-background-color": css("--bg"), "text-background-opacity": 1, "text-rotation": "autorotate" } },
    ],
    layout: known ? { name: "preset" } : graphLayout(!!state.graphPos),
  });
  state.cy = cy;
  if (known && state.graphZoom) { cy.zoom(state.graphZoom.zoom); cy.pan(state.graphZoom.pan); }
  cy.on("tap", "node", (ev) => selectNode(ev.target.id()));
  cy.on("tap", (ev) => { if (ev.target === cy) selectNode(null); });
  cy.on("dbltap", "node", (ev) => expandNode(ev.target.id()));
  cy.on("mouseover", "edge", (ev) => ev.target.addClass("hl"));
  cy.on("mouseout", "edge", (ev) => ev.target.removeClass("hl"));
  applyGraphFilters();
}

function graphLayout(keepPositions) {
  const name = state.filters.layout || "cose";
  const roots = state.graphFocus ? [state.graphFocus]
    : state.graphData.nodes.filter((n) => n.type === "agent").map((n) => n.id);
  const eles = state.cy ? state.cy.elements().not(".hidden") : undefined;
  if (name === "breadthfirst") {
    return { name, eles, directed: !state.graphFocus, spacingFactor: 1.1, animate: false, roots };
  }
  if (name === "concentric") {
    const rank = { agent: 6, project: 5, session: 4, tool: 3, mcp: 2, destination: 1, sensitive: 1 };
    return { name, eles, animate: false, minNodeSpacing: 18, levelWidth: () => 1,
             concentric: (n) => (n.id() === state.graphFocus ? 9 : rank[n.data("type")] || 0) };
  }
  return { name: "cose", eles, animate: false, randomize: !keepPositions, nodeRepulsion: () => 9000,
           idealEdgeLength: () => 70, nodeOverlap: 12, gravity: 0.6, numIter: 1500, padding: 24 };
}

      const t = NODE_TYPES[g.focus.type] || {};
      bar = `<div class="notice">Focused on ${esc((t.label || g.focus.type).toLowerCase())}
        <strong>${esc(g.focus.label)}</strong>: the ${g.focus.actions} action${g.focus.actions === 1 ? "" : "s"} that
        involve it. Counts cover the whole time range. ${back}
        <button class="btn mini" data-gnav="all">Show everything</button></div>`;
    } else if (g.focus) {
      bar = `<div class="notice"><strong>${esc(g.focus.id)}</strong> has no actions in this time range. ${back}
        <button class="btn mini" data-gnav="all">Show everything</button></div>`;
    }
    if (!g.nodes.length) {
      return bar + '<div class="card"><div class="empty">No captured actions in this range</div></div>';
    }
    if (g.truncated) {
      bar += `<div class="notice">Showing ${g.nodes.length} of ${g.total_nodes} entities: the most severe and busiest
        are kept. Narrow the time range, or focus on an entity, to see the rest.</div>`;
    }
    const layouts = [["cose", "Force"], ["breadthfirst", "Hierarchy"], ["concentric", "Concentric"]];
    const cur = state.filters.layout || "cose";
    const chips = Object.entries(NODE_TYPES).map(([k, t]) => `<button class="chip${state.graphHide.has(k) ? " off" : ""}"
      data-gtype="${k}" title="Show or hide ${esc(t.label.toLowerCase())} nodes"><i class="gtype"
      style="background:var(${t.color})"></i>${esc(t.label)}</button>`).join("");
    const verdicts = Object.entries(VERDICT_FILTERS).map(([k, v]) =>
      `<option value="${k}"${k === state.graphVerdict ? " selected" : ""}>${esc(v.label)}</option>`).join("");
    const legend = ["block", "ask", "mask", "context"].map((v) =>
      `<span><i style="background:var(--${v})"></i>${v}</span>`).join("")
      + '<span><i style="background:var(--edge)"></i>allow / dry-run</span>'
      + '<span class="muted">Destinations: domain, <span class="c-private-ip">private IP</span>, '
      + '<span class="c-public-ip">public IP</span>, loopback (grey)</span>';
    return `${bar}<div class="graph-wrap"><div class="card">
      <div class="filters"><select data-filter="layout" title="Layout">${layouts.map(([v, l]) =>
        `<option value="${v}"${v === cur ? " selected" : ""}>${l} layout</option>`).join("")}</select>
        <select data-gverdict="1" title="Verdict filter">${verdicts}</select>
        <button class="btn" data-graph="relayout">Re-run layout</button><button class="btn" data-graph="fit">Fit</button>
        <span class="muted" id="gcount" style="align-self:center"></span></div>
      <div class="filters">${chips}</div>
      <div id="cy"></div><div class="legend">${legend}</div></div>
      <div class="card graph-side" id="graph-side"></div></div>`;
  },
};

function verdictTags(counts) {
  return Object.entries(counts || {}).sort((a, b) => b[1] - a[1])
    .map(([v, n]) => `<span class="pill v-${esc(v)}">${esc(v)} ${n}</span>`).join(" ");
}

async function openSession(key) {
  const d = await api("/api/session", { key, since: 0 });
  const turns = d.turns.map((t) => {
    const prompt = t.prompt ? `<div class="who">Prompt ${pill(t.prompt.verdict)}</div>
      <div class="clip">${esc(t.prompt.text || "(empty)")}</div>` : "";
    const tools = t.tools.map((x) => `<div class="tool" data-capture="${esc(x.capture_id)}">${pill(x.verdict)}
      <strong>${esc(x.tool || "?")}</strong> <span class="muted">${fmtTs(x.ts)}${x.duration_ms != null
      ? " &middot; " + fmtMs(Math.round(x.duration_ms)) : ""}</span>
      ${x.sensitive.map((l) => `<span class="tag warn">${esc(l)}</span>`).join("")}
      ${x.destinations.map((h) => `<span class="tag">${esc(h)}</span>`).join("")}
      <div><code>${esc(x.summary)}</code></div></div>`).join("");
    const tok = t.tokens && t.tokens.output_tokens != null
      ? ` <span class="muted">${Math.round(t.tokens.input_tokens || 0)} in / ${Math.round(t.tokens.output_tokens)} out
        tokens</span>` : "";
    const response = t.response ? `<div class="who" style="margin-top:6px">Response ${pill(t.response.verdict)}${tok}
      </div><div class="clip">${esc(t.response.text || "(no text captured)")}</div>` : "";
    return `<div class="turn"><div class="muted">${fmtTs(t.ts)}</div>${prompt}${tools}${response}</div>`;
  }).join("");
  $("#drawer").innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center">
    <strong>Session ${esc(key)}</strong><span>${graphLink("session:" + key)}
    <button class="btn" id="close">Close</button></span></div>
    ${turns || '<p class="muted">No events</p>'}`;
  $("#drawer").classList.add("open");
  $("#close").onclick = () => $("#drawer").classList.remove("open");
}

function kv(obj, keys) {
  return `<dl class="kv">${keys.filter((k) => obj[k] != null && obj[k] !== "").map((k) =>
    `<dt>${esc(k)}</dt><dd>${esc(obj[k])}</dd>`).join("")}</dl>`;
}
function pretty(v) { return esc(typeof v === "string" ? v : JSON.stringify(v, null, 2)); }

async function openDetail(runId, captureId) {
  const params = {};
  if (runId) params.run_id = runId;
  if (captureId) params.capture_id = captureId;
  const d = await api("/api/event", params);
  const c = d.capture, r = d.run;
  let html = `<div style="display:flex;justify-content:space-between;align-items:center">
    <strong>${esc((c && c.event) || (r && r.event) || "event")}</strong>
    <button class="btn" id="close">Close</button></div>`;
  if (c) {
    html += `<h3>Verdict</h3><p>${pill(c.verdict)} ${esc(c.reason || "")}</p>
      ${kv(c, ["ts", "tool_name", "session_id", "cwd", "latency_ms", "exit_code", "timed_out", "child_pid",
               "hook_version", "dry_run", "tap_error"])}
      <h3>Hook stdout ${c.dry_run ? "(dry-run payload, not a decision)" : "(verdict JSON)"}</h3>
      <pre>${c.stdout_text ? pretty(c.stdout_text) : "(empty: no decision, agent default)"}</pre>
      <h3>Event payload from the agent (redacted)</h3><pre>${pretty(c.stdin_json)}</pre>`;
  } else {
    html += '<p class="muted">No tap capture for this run.</p>';
  }
  if (r) {
    html += `<h3>Debug-log run</h3>${kv(r, ["run_id", "agent", "pid", "start_ts", "duration_ms", "outcome",
      "http_status", "url", "post_bytes", "stdin_bytes", "key_source", "installed_config", "mcp_artifacts",
      "project_root", "sender", "retries", "fallbacks", "error_count"])}
      <h3>Log lines</h3><pre>${d.lines.map((l) => `<span class="lvl-${esc(l.level)}">${fmtTs(l.ts)} ${esc(l.level)}
[${esc(l.location)}] ${esc(l.message)}</span>`).join("\n")}</pre>`;
  }
  $("#drawer").innerHTML = html;
  $("#drawer").classList.add("open");
  $("#close").onclick = () => $("#drawer").classList.remove("open");
}

async function render() {
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === state.tab));
  try {
    const html = await views[state.tab]();
    saveGraphView();
    $("#view").innerHTML = html;
    if (state.tab === "graph") initGraph();
  } catch (err) {
    saveGraphView();
    $("#view").innerHTML = `<div class="card"><div class="empty">${esc(err.message)}</div></div>`;
  }
}

$("#tabs").addEventListener("click", (ev) => {
  const tab = ev.target.dataset && ev.target.dataset.tab;
  if (tab) { state.tab = tab; history.replaceState(null, "", tab === "graph" ? graphHash() : "#" + tab); render(); }
});
$("#range").addEventListener("change", () => { state.offset = 0; render(); });
$("#refresh").addEventListener("click", async () => {
  $("#refresh").disabled = true;
  try { await fetch("/api/ingest", { method: "POST", headers: { "X-Aidr-Obs": "1" } }); } finally {
    $("#refresh").disabled = false;
  }
  render();
});
let timer = null;
$("#auto").addEventListener("change", (ev) => {
  clearInterval(timer);
  if (ev.target.checked) timer = setInterval(() => $("#refresh").click(), 10000);
});
$("#view").addEventListener("click", (ev) => {
  const gf = ev.target.closest("[data-gfocus]");
  if (gf) { setGraphFocus(gf.dataset.gfocus); return; }
  const gx = ev.target.closest("[data-gexpand]");
  if (gx) { expandNode(gx.dataset.gexpand); return; }
  const gn = ev.target.closest("[data-gnav]");
  if (gn) { if (gn.dataset.gnav === "back") graphBack(); else setGraphFocus(null, { push: false }); return; }
  const gt = ev.target.closest("[data-gtype]");
  if (gt) {
    const t = gt.dataset.gtype;
    if (state.graphHide.has(t)) state.graphHide.delete(t); else state.graphHide.add(t);
    gt.classList.toggle("off", state.graphHide.has(t));
    applyGraphFilters();
    return;
  }
  const nbr = ev.target.closest("[data-node]");
  if (nbr) { selectNode(nbr.dataset.node); if (state.cy) state.cy.animate({ center: { eles: state.cy.getElementById(
    nbr.dataset.node) } }, { duration: 200 }); return; }
  const gAction = ev.target.dataset && ev.target.dataset.graph;
  if (gAction && state.cy) {
    if (gAction === "fit") state.cy.fit(undefined, 24);
    else state.cy.layout(graphLayout(false)).run();
    return;
  }
  const page = ev.target.dataset && ev.target.dataset.page;
  if (page) { state.offset = Math.max(0, state.offset + 200 * Number(page)); render(); return; }
  const session = ev.target.closest("[data-session]");
  if (session) { openSession(session.dataset.session); return; }
  const row = ev.target.closest("tr.clickable, [data-capture]");
  if (row) openDetail(row.dataset.run, row.dataset.capture);
});
$("#drawer").addEventListener("click", (ev) => {
  const gf = ev.target.closest("[data-gfocus]");
  if (gf) { setGraphFocus(gf.dataset.gfocus); return; }
  const tool = ev.target.closest(".turn [data-capture]");
  if (tool) openDetail(null, tool.dataset.capture);
});
$("#view").addEventListener("change", (ev) => {
  const key = ev.target.dataset && ev.target.dataset.filter;
  if (ev.target.dataset && ev.target.dataset.gverdict) { state.graphVerdict = ev.target.value; applyGraphFilters();
    return; }
  if (key === "layout") { state.filters.layout = ev.target.value; if (state.cy) state.cy.layout(graphLayout(false)).run();
    return; }
  if (key) { state.filters[key] = ev.target.value; state.offset = 0; render(); }
});
let qTimer = null;
$("#view").addEventListener("input", (ev) => {
  if (ev.target.id !== "q") return;
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { state.filters.q = ev.target.value; state.offset = 0; render().then(() => {
    const q = $("#q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }); }, 300);
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") $("#drawer").classList.remove("open"); });
{
  const [tab, qs] = location.hash.slice(1).split("?");
  if (views[tab]) state.tab = tab;
  if (tab === "graph" && qs) { state.graphFocus = new URLSearchParams(qs).get("focus") || null;
    state.graphSel = state.graphFocus; }
}
render();
</script>
</body>
</html>
